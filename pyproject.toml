[project]
name = "glide-cpu-tools"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub==1.33.0",
    "jinja2==3.1.6",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "safetensors==0.8.0",
    "tokenizers==0.23.2",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
